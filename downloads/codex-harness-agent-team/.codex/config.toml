model = "gpt-6-astra"
model_reasoning_effort = "high"

[features]
multi_agent_v2 = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.implementer]
description = "Makes bounded code changes assigned by the planner."
config_file = "agents/implementer.toml"
